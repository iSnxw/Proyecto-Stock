<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frío y Stock · Posta Rural</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>

<section id="login">
  <div class="hero">
    <div>
      <h1>Cada lote, siempre a la temperatura correcta.</h1>
      <p>Control de stock FEFO, trazabilidad de bodega y cadena de frío para la posta.</p>
    </div>
    <svg viewBox="0 0 400 260" role="img" aria-label="Refrigerador clínico con viales y termómetro">
      <rect x="70" y="20" width="260" height="220" rx="22" fill="#e3f4f6"/>
      <rect x="70" y="112" width="260" height="6" fill="#a9d3da"/>
      <rect x="296" y="40" width="8" height="52" rx="4" fill="#7fb4bd"/>
      <rect x="296" y="136" width="8" height="70" rx="4" fill="#7fb4bd"/>
      <g fill="#fff" stroke="#12908f" stroke-width="3">
        <rect x="100" y="52" width="26" height="46" rx="6"/>
        <rect x="138" y="62" width="26" height="36" rx="6"/>
        <rect x="176" y="48" width="26" height="50" rx="6"/>
      </g>
      <g fill="#12908f">
        <rect x="100" y="52" width="26" height="12"/>
        <rect x="138" y="62" width="26" height="12"/>
        <rect x="176" y="48" width="26" height="12"/>
      </g>
      <g fill="#fff" stroke="#0b3b4f" stroke-width="3">
        <rect x="104" y="150" width="62" height="64" rx="8"/>
        <rect x="178" y="162" width="62" height="52" rx="8"/>
      </g>
      <g stroke="#0b3b4f" stroke-width="3" stroke-linecap="round">
        <path d="M122 168h26M122 182h18"/>
        <path d="M196 178h26"/>
      </g>
      <rect x="338" y="40" width="30" height="170" rx="15" fill="#fff"/>
      <circle cx="353" cy="206" r="20" fill="#12908f"/>
      <rect x="348" y="90" width="10" height="116" rx="5" fill="#12908f"/>
    </svg>
  </div>

  <div class="formside">
    <form id="login-form" novalidate>
      <h2>Iniciar sesión</h2>
      <p class="subtitle">Acceso restringido al personal autorizado de la posta.</p>
      <label for="login-email">Correo institucional</label>
      <input id="login-email" type="email" autocomplete="username" required placeholder="usuario@posta.cl">
      <label for="login-pass">Contraseña</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <div class="err" id="login-err" role="alert"></div>
      <button type="submit" class="btn full mt-sm" id="login-btn">Entrar</button>
    </form>
  </div>
</section>

<div id="app" class="hide">
  <header class="mobile-bar">
    <span class="brand-sm">Frío y Stock</span>
    <div class="mobile-user">
      <span id="mobile-role" class="chip"></span>
      <button type="button" class="btn ghost sm btn-light" id="logout-mobile">Salir</button>
    </div>
  </header>

  <nav aria-label="Secciones principales">
    <div class="brand">Frío y Stock</div>
    <button type="button" data-view="stock" aria-current="true">Stock</button>
    <button type="button" data-view="frio">Cadena de frío</button>
    <button type="button" data-view="bodega" id="nav-bodega" class="hide">Bodega</button>
    <button type="button" data-view="hist" id="nav-hist" class="hide">Historial</button>
    <div class="who">
      <div id="who-name"></div>
      <div id="who-role" class="who-role"></div>
      <button type="button" class="btn ghost sm btn-light mt-sm" id="logout-btn">Cerrar sesión</button>
    </div>
  </nav>

  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
