{% extends "base.html" %}
{% block titulo %}Iniciar Sesión · Posta Rural{% endblock %}

{% block contenido %}
<section class="tarjeta tarjeta-login">
    <h1>Iniciar Sesión</h1>
    <p class="subtitulo">Sistema de Gestión de Stock, Bodega y Cadena de Frío</p>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="campo">
            <label for="correo">Correo institucional</label>
            <input type="email" id="correo" name="correo" required autocomplete="username" placeholder="usuario@posta.cl">
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primario">Ingresar</button>
    </form>
</section>
{% endblock %}
